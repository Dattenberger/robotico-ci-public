# Test the checked-out action tree before moving v1; ci is the single required check.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ${{ vars.CI_RUNS_ON_S || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Unit tests
        run: python3 -m unittest discover -s tests -t .
      - uses: ./actions/gitleaks-scan

# Required workflow for the organisation ruleset: PR range only. The full-history nightly sweep lives in
# robotico-ci. Public repositories and fork PRs use GitHub-hosted runners: CI_RUNS_ON_S is private-only.
# Checkout is the target repository. A local ./ action would resolve there, so the scan uses the public @v1.
# The fetch is plain git, not actions/checkout: checkout's credential cleanup runs `git submodule foreach`, which
# fails on a gitlink without a .gitmodules entry and so left such repositories without a verdict.
# The fetch needs an empty workspace: the CI pool and GitHub-hosted runners are ephemeral; persistent runners are
# not supported.
# @see README.md
name: secret-scan

on:
  # edited: a PR moved to another base branch is scanned again over the new range.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_call:
    inputs:
      history:
        description: "History to scan: full or pr (pr requires a pull_request event)"
        type: string
        default: full

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ${{ vars.CI_RUNS_ON_S || 'ubuntu-latest' }}
    steps:
      - name: Fetch history
        shell: bash
        env:
          RCI_TOKEN: ${{ github.token }}
          RCI_SERVER: ${{ github.server_url }}
          RCI_REPO: ${{ github.repository }}
          RCI_SHA: ${{ github.sha }}
          RCI_HISTORY: ${{ inputs.history }}
          RCI_EVENT: ${{ github.event_name }}
          RCI_HEAD: ${{ github.event.pull_request.head.sha }}
          RCI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # Full PR scans need only the default branch and PR head, including fork PR heads served by the target,
          # plus the commit under test: the checkout stays on it so .gitleaks.toml and .gitleaksignore come from the
          # merged tree, never from a PR head that predates the default branch's allowlist. Other modes retain all
          # refs. Credentials stay in this step's environment.
          if ! [[ "$RCI_SHA" =~ ^[0-9a-f]{40}$ ]]; then echo "::error::invalid commit SHA"; exit 1; fi
          refspecs=('+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
                    "+$RCI_SHA:refs/remotes/rci/checkout")
          if [ "$RCI_HISTORY" = full ] && [ "$RCI_EVENT" = pull_request ]; then
            if ! [[ "$RCI_HEAD" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::invalid pull request head SHA"; exit 1
            fi
            if [ -z "$RCI_DEFAULT_BRANCH" ] || ! git check-ref-format "refs/heads/$RCI_DEFAULT_BRANCH"; then
              echo "::error::invalid default branch"; exit 1
            fi
            refspecs=("+refs/heads/$RCI_DEFAULT_BRANCH:refs/remotes/rci/default"
                      "+$RCI_HEAD:refs/remotes/rci/head" "+$RCI_SHA:refs/remotes/rci/checkout")
          fi
          if [ -n "$(ls -A .)" ]; then echo "::error::the workspace is not empty"; exit 1; fi
          header=$(printf 'x-access-token:%s' "$RCI_TOKEN" | base64 -w0)
          echo "::add-mask::$header"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.$RCI_SERVER/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $header" GIT_LFS_SKIP_SMUDGE=1 GIT_TERMINAL_PROMPT=0
          git init -q .
          git remote add origin "$RCI_SERVER/$RCI_REPO"
          git -c protocol.version=2 fetch --quiet --no-tags --prune --no-recurse-submodules origin \
            "${refspecs[@]}"
          git -c core.hooksPath=/dev/null -c advice.detachedHead=false checkout --quiet --detach "$RCI_SHA"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          if git config --local --get-regexp '^http\..*\.extraheader$' >/dev/null; then
            echo "::error::credentials in git config"; exit 1
          fi
      - name: Select history
        id: history
        shell: bash
        env:
          RCI_HISTORY: ${{ inputs.history }}
          RCI_EVENT: ${{ github.event_name }}
          RCI_BASE: ${{ github.event.pull_request.base.sha }}
          RCI_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          case "$RCI_HISTORY" in
            full)
              if [ "$RCI_EVENT" = pull_request ]; then
                if ! [[ "$RCI_HEAD" =~ ^[0-9a-f]{40}$ ]]; then
                  echo "::error::invalid pull request head SHA"; exit 1
                fi
                if ! default=$(git --no-optional-locks rev-parse --verify 'refs/remotes/rci/default^{commit}') ||
                    ! [[ "$default" =~ ^[0-9a-f]{40}$ ]]; then
                  echo "::error::default branch tip is unavailable - no scan"; exit 1
                fi
                printf 'range=\nrevisions=%s %s\n' "$default" "$RCI_HEAD" >> "$GITHUB_OUTPUT"
              else
                printf 'range=\n' >> "$GITHUB_OUTPUT"
              fi
              ;;
            pr|"")
              if [ "$RCI_EVENT" != pull_request ]; then
                echo "::error::history: pr requires a pull_request event"; exit 1
              fi
              range="$RCI_BASE..$RCI_HEAD"
              if ! [[ "$range" =~ ^[0-9a-f]{40}\.\.[0-9a-f]{40}$ ]]; then
                echo "::error::invalid pull request commit SHAs"; exit 1
              fi
              printf 'range=%s\n' "$range" >> "$GITHUB_OUTPUT"
              ;;
            *) echo "::error::history must be pr or full"; exit 1 ;;
          esac
      - uses: Dattenberger/robotico-ci-public/actions/gitleaks-scan@v1
        with:
          range: ${{ steps.history.outputs.range }}
          revisions: ${{ steps.history.outputs.revisions }}

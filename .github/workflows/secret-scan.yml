# Required workflow for the organisation ruleset: PR range only. The full-history nightly sweep lives in
# robotico-ci. Public repositories and fork PRs use GitHub-hosted runners: CI_RUNS_ON_S is private-only.
# Checkout is the target repository. A local ./ action would resolve there, so the scan uses the public @v1.
# The fetch is plain git, not actions/checkout: checkout's credential cleanup runs `git submodule foreach`, which
# fails on a gitlink without a .gitmodules entry and so left such repositories without a verdict.
# The fetch needs an empty workspace or exactly one seed: a self-hosted runner may pre-seed the workspace with a
# marked checkout of the same repository before the first step. A seed only speeds up the fetch; its refs are deleted
# after it, so every scan sees the refs of a cold run. Anything else in the workspace fails the job; persistent runners
# are not supported. GitHub-hosted runners always start empty.
# @see README.md
name: secret-scan

on:
  # edited: a PR moved to another base branch is scanned again over the new range.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_call:
    inputs:
      history:
        description: "History to scan: full or pr (pr requires a pull_request event)"
        type: string
        default: full

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ${{ vars.CI_RUNS_ON_S || 'ubuntu-latest' }}
    steps:
      - name: Fetch history
        shell: bash
        env:
          RCI_TOKEN: ${{ github.token }}
          RCI_SERVER: ${{ github.server_url }}
          RCI_REPO: ${{ github.repository }}
          RCI_SHA: ${{ github.sha }}
          RCI_HISTORY: ${{ inputs.history }}
          RCI_EVENT: ${{ github.event_name }}
          RCI_HEAD: ${{ github.event.pull_request.head.sha }}
          RCI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # Full PR scans need only the default branch and PR head, including fork PR heads served by the target,
          # plus the commit under test: the checkout stays on it so .gitleaks.toml and .gitleaksignore come from the
          # merged tree, never from a PR head that predates the default branch's allowlist. Other modes retain all
          # refs. Credentials stay in this step's environment.
          if ! [[ "$RCI_SHA" =~ ^[0-9a-f]{40}$ ]]; then echo "::error::invalid commit SHA"; exit 1; fi
          refspecs=('+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
                    "+$RCI_SHA:refs/remotes/rci/checkout")
          if [ "$RCI_HISTORY" = full ] && [ "$RCI_EVENT" = pull_request ]; then
            if ! [[ "$RCI_HEAD" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::invalid pull request head SHA"; exit 1
            fi
            if [ -z "$RCI_DEFAULT_BRANCH" ] || ! git check-ref-format "refs/heads/$RCI_DEFAULT_BRANCH"; then
              echo "::error::invalid default branch"; exit 1
            fi
            refspecs=("+refs/heads/$RCI_DEFAULT_BRANCH:refs/remotes/rci/default"
                      "+$RCI_HEAD:refs/remotes/rci/head" "+$RCI_SHA:refs/remotes/rci/checkout")
          fi
          # A seed is a checkout of this repository a self-hosted runner left before the first step: marker
          # .git/ci-seed (v=1, repo=, repacked=, optional prepared=), refs only under refs/ci-seed/, HEAD detached,
          # config limited to the keys below with origin at this repository, no hooks, alternates, shallow history or
          # links, everything owned by the runner user, the working tree clean at HEAD. The marker's repo= and the
          # origin URL compare case-insensitively: GitHub names are, and a runner may use its own spelling.
          # seed_refusal prints a fixed reason (never workspace text) and returns 1 for anything else; git runs only
          # after the files that could make it execute code (config, hooks) passed, and then without hooks, fsmonitor
          # or untracked cache.
          seed_refusal() {
            local name value line git_c expected_url urls=0 version='' repo='' repacked='' prepared='' head=''
            local refs='' flags=''
            git_c=(-c core.hooksPath=/dev/null -c core.fsmonitor=false -c core.untrackedCache=false)
            expected_url="$RCI_SERVER/$RCI_REPO"
            { [ -d .git ] && [ ! -L .git ]; } || { echo 'no .git directory'; return 1; }
            [ -z "$(find . ! -uid "$(id -u)" -print -quit)" ] || { echo 'not owned by the runner user'; return 1; }
            [ -z "$(find .git -type l -print -quit)" ] || { echo 'link in .git'; return 1; }
            # git status never lists a path below a .git component.
            [ -z "$(find . -mindepth 2 -name .git -print -quit)" ] || { echo 'nested repository'; return 1; }
            while IFS= read -r -d '' name; do
              case "$name" in
                HEAD|config|ci-seed|index|packed-refs|FETCH_HEAD|ORIG_HEAD) [ -f ".git/$name" ] ||
                  { echo 'unexpected entry in .git'; return 1; } ;;
                objects|refs|logs) [ -d ".git/$name" ] || { echo 'unexpected entry in .git'; return 1; } ;;
                hooks) { [ -d .git/hooks ] && [ -z "$(ls -A .git/hooks)" ]; } || { echo 'hooks'; return 1; } ;;
                info) [ -d .git/info ] && [ -z "$(find .git/info -mindepth 1 ! -path .git/info/refs -print -quit)" ] ||
                  { echo 'unexpected entry in .git/info'; return 1; } ;;
                *) echo 'unexpected entry in .git'; return 1 ;;
              esac
            done < <(find .git -mindepth 1 -maxdepth 1 -printf '%f\0')
            for name in objects/info/alternates objects/info/http-alternates; do
              [ ! -e ".git/$name" ] || { echo 'alternates'; return 1; }
            done
            { [ -f .git/ci-seed ] && [ "$(stat -c %s .git/ci-seed)" -le 1024 ]; } || { echo 'no marker'; return 1; }
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in
                v=*) [ -z "$version" ] && version=${line#v=} ;;
                repo=*) [ -z "$repo" ] && repo=${line#repo=} ;;
                repacked=*) [ -z "$repacked" ] && repacked=${line#repacked=} ;;
                prepared=*) [ -z "$prepared" ] && prepared=${line#prepared=} ;;
                *) false ;;
              esac || { echo 'malformed marker'; return 1; }
            done < .git/ci-seed
            { [ "$version" = 1 ] && [ "${repo,,}" = "${RCI_REPO,,}" ] && [[ "$repacked" =~ ^[0-9]{1,12}$ ]] &&
              [[ -z "$prepared" || "$prepared" =~ ^[0-9a-f]{40}$ ]]; } || { echo 'malformed marker'; return 1; }
            git config --file .git/config --no-includes --list >/dev/null 2>&1 ||
              { echo 'config unreadable'; return 1; }
            while IFS= read -r -d '' name; do
              value=${name#*$'\n'} name=${name%%$'\n'*}
              case "$name" in
                core.repositoryformatversion|core.filemode|core.logallrefupdates|gc.auto) ;;
                core.bare) [ "$value" = false ] || { echo 'bare repository'; return 1; } ;;
                remote.origin.url) urls=$((urls + 1))
                  [ "${value,,}" = "${expected_url,,}" ] || { echo 'origin is another repository'; return 1; } ;;
                *) echo 'config key outside the allowed set'; return 1 ;;
              esac
            done < <(git config --file .git/config --no-includes --list --null)
            [ "$urls" -eq 1 ] || { echo 'origin is another repository'; return 1; }
            { [ "$(stat -c %s .git/HEAD)" -eq 41 ] && read -r head < .git/HEAD && [[ "$head" =~ ^[0-9a-f]{40}$ ]] &&
              git "${git_c[@]}" rev-parse --quiet --verify "$head^{commit}" >/dev/null; } ||
              { echo 'HEAD is not detached at a commit'; return 1; }
            refs=$(git "${git_c[@]}" for-each-ref --format='%(refname)') || { echo 'refs unreadable'; return 1; }
            while IFS= read -r name; do
              case "$name" in refs/ci-seed/*|'') ;; *) echo 'ref outside refs/ci-seed/'; return 1 ;; esac
            done <<< "$refs"
            # Assume-unchanged or skip-worktree entries would hide changed files from status.
            flags=$(git "${git_c[@]}" ls-files -v) || { echo 'index unreadable'; return 1; }
            { [ -z "$flags" ] || ! grep -qv '^H ' <<< "$flags"; } || { echo 'index flags'; return 1; }
            [ -z "$(git "${git_c[@]}" --no-optional-locks status --porcelain=v1 --ignored --untracked-files=all)" ] ||
              { echo 'files beside the seed or changed'; return 1; }
          }
          seed=0
          if [ -n "$(ls -A .)" ]; then
            if ! refusal=$(seed_refusal); then
              echo "::error::the workspace is not empty and holds no valid seed ($refusal)"; exit 1
            fi
            seed=1
          fi
          header=$(printf 'x-access-token:%s' "$RCI_TOKEN" | base64 -w0)
          echo "::add-mask::$header"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.$RCI_SERVER/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $header" GIT_LFS_SKIP_SMUDGE=1 GIT_TERMINAL_PROMPT=0
          if [ "$seed" = 0 ]; then
            git init -q .
            git remote add origin "$RCI_SERVER/$RCI_REPO"
          else
            # The config git remote add writes: this repository's spelling of the URL, and the refspec that makes
            # fetch's opportunistic origin/* updates match a cold run.
            git config remote.origin.url "$RCI_SERVER/$RCI_REPO"
            git config remote.origin.fetch '+refs/heads/*:refs/remotes/origin/*'
          fi
          git -c protocol.version=2 -c core.hooksPath=/dev/null fetch --quiet --no-tags --prune \
            --no-recurse-submodules origin "${refspecs[@]}"
          if [ "$seed" = 1 ]; then
            # The seed's objects served the negotiation; without its refs, --all and every range match a cold run.
            git for-each-ref --format='delete %(refname)' refs/ci-seed/ |
              git -c core.hooksPath=/dev/null update-ref --stdin
          fi
          git -c core.hooksPath=/dev/null -c advice.detachedHead=false checkout --quiet --detach "$RCI_SHA"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          if git config --local --get-regexp '^http\..*\.extraheader$' >/dev/null; then
            echo "::error::credentials in git config"; exit 1
          fi
      - name: Select history
        id: history
        shell: bash
        env:
          RCI_HISTORY: ${{ inputs.history }}
          RCI_EVENT: ${{ github.event_name }}
          RCI_BASE: ${{ github.event.pull_request.base.sha }}
          RCI_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          case "$RCI_HISTORY" in
            full)
              if [ "$RCI_EVENT" = pull_request ]; then
                if ! [[ "$RCI_HEAD" =~ ^[0-9a-f]{40}$ ]]; then
                  echo "::error::invalid pull request head SHA"; exit 1
                fi
                if ! default=$(git --no-optional-locks rev-parse --verify 'refs/remotes/rci/default^{commit}') ||
                    ! [[ "$default" =~ ^[0-9a-f]{40}$ ]]; then
                  echo "::error::default branch tip is unavailable - no scan"; exit 1
                fi
                printf 'range=\nrevisions=%s %s\n' "$default" "$RCI_HEAD" >> "$GITHUB_OUTPUT"
              else
                printf 'range=\n' >> "$GITHUB_OUTPUT"
              fi
              ;;
            pr|"")
              if [ "$RCI_EVENT" != pull_request ]; then
                echo "::error::history: pr requires a pull_request event"; exit 1
              fi
              range="$RCI_BASE..$RCI_HEAD"
              if ! [[ "$range" =~ ^[0-9a-f]{40}\.\.[0-9a-f]{40}$ ]]; then
                echo "::error::invalid pull request commit SHAs"; exit 1
              fi
              printf 'range=%s\n' "$range" >> "$GITHUB_OUTPUT"
              ;;
            *) echo "::error::history must be pr or full"; exit 1 ;;
          esac
      - uses: Dattenberger/robotico-ci-public/actions/gitleaks-scan@v1
        with:
          range: ${{ steps.history.outputs.range }}
          revisions: ${{ steps.history.outputs.revisions }}

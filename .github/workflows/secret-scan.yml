# Required workflow for the organisation ruleset: PR range only. The full-history nightly sweep lives in
# robotico-ci. Public repositories and fork PRs use GitHub-hosted runners: CI_RUNS_ON_S is private-only.
# Checkout is the target repository. A local ./ action would resolve there, so the scan uses the public @v1.
# @see README.md
name: secret-scan

on:
  # edited: a PR moved to another base branch is scanned again over the new range.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_call:
    inputs:
      history:
        description: "History to scan: full or pr (pr requires a pull_request event)"
        type: string
        default: full

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ${{ vars.CI_RUNS_ON_S || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select history
        id: history
        shell: bash
        env:
          RCI_HISTORY: ${{ inputs.history }}
          RCI_EVENT: ${{ github.event_name }}
          RCI_BASE: ${{ github.event.pull_request.base.sha }}
          RCI_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          case "$RCI_HISTORY" in
            full) printf 'range=\n' >> "$GITHUB_OUTPUT" ;;
            pr|"")
              if [ "$RCI_EVENT" != pull_request ]; then
                echo "::error::history: pr requires a pull_request event"; exit 1
              fi
              range="$RCI_BASE..$RCI_HEAD"
              if ! [[ "$range" =~ ^[0-9a-f]{40}\.\.[0-9a-f]{40}$ ]]; then
                echo "::error::invalid pull request commit SHAs"; exit 1
              fi
              printf 'range=%s\n' "$range" >> "$GITHUB_OUTPUT"
              ;;
            *) echo "::error::history must be pr or full"; exit 1 ;;
          esac
      - uses: Dattenberger/robotico-ci-public/actions/gitleaks-scan@v1
        with:
          range: ${{ steps.history.outputs.range }}
